name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest --cov=veilgate --cov-report=term-missing
      - run: python -m pip check
      - run: pip-audit --no-deps --disable-pip -r requirements.lock
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t veilgate:test .
      - name: Verify container startup and publication
        shell: bash
        run: |
          set -euo pipefail
          export VEILGATE_DEMO_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$VEILGATE_DEMO_TOKEN"
          docker compose up -d --build --wait --wait-timeout 90
          trap 'docker compose down' EXIT
          curl --fail --silent http://127.0.0.1:8000/readyz
          curl --fail --silent \
            -H "Authorization: Bearer $VEILGATE_DEMO_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8000/v1/resources/customers/read > /tmp/response.json
          python3 - <<'PY'
          import json
          with open('/tmp/response.json') as f:
              data = json.load(f)
          assert data['rows'] == [{'region': 'East', 'amount': '100'}, {'region': 'West', 'amount': '200'}]
          PY
