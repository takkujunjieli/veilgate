services:
  veilgate:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VEILGATE_DEMO_TOKEN: "${VEILGATE_DEMO_TOKEN:?Generate a random demo token first}"
    volumes:
      - ./examples/policy.toml:/config/policy.toml:ro
      - ./examples/data:/data:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
